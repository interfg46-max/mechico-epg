name: Aggiorna guida TV

on:
  schedule:
    - cron: '11 */4 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  epg:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Crea la guida
        run: |
          python - <<'PY'
          import calendar, gzip, io, json, os, re, sys, time, unicodedata, urllib.request
          import xml.etree.ElementTree as ET

          # Fonti della guida (se una non risponde si passa alla successiva)
          SOURCES = os.environ.get("EPG_SOURCES", "").split() or [
              "https://epgshare01.online/epgshare01/epg_ripper_IT1.xml.gz",
          ]
          # Correzioni: nome del canale come lo scrive il provider (minuscolo, senza HD) -> nome nella guida
          ALIASES = {
              # "sky sport uno": "sky sport 251",
          }

          NOW = int(time.time())
          FROM, TO, DESC_UNTIL = NOW - 3600, NOW + 36 * 3600, NOW + 6 * 3600

          def norm(s):
              s = unicodedata.normalize("NFKD", s).encode("ascii", "ignore").decode().lower()
              s = re.sub(r"[\[\(\{].*?[\]\)\}]", " ", s)
              s = re.sub(r"^[\s|]*(?:it|ita|italia|italy)\s*[:|\-]\s*", "", s)
              s = re.sub(r"\b(?:hd|fhd|uhd|sd|4k|8k|hevc|h265|h264|raw|fullhd)\b", " ", s)
              s = re.sub(r"([a-z])(\d)", r"\1 \2", s)
              s = re.sub(r"(\d)([a-z])", r"\1 \2", s)
              return re.sub(r"[^a-z0-9]+", " ", s).strip()

          def tstamp(s):
              try:
                  t = calendar.timegm((int(s[0:4]), int(s[4:6]), int(s[6:8]), int(s[8:10]), int(s[10:12]), int(s[12:14])))
                  rest = s[14:].strip()
                  if len(rest) >= 5 and rest[0] in "+-":
                      off = int(rest[1:3]) * 3600 + int(rest[3:5]) * 60
                      t -= off if rest[0] == "+" else -off
                  return t
              except Exception:
                  return 0

          def fetch(url):
              req = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0 (mechico-epg)"})
              data = urllib.request.urlopen(req, timeout=120).read()
              return gzip.decompress(data) if data[:2] == b"\x1f\x8b" else data

          chans = {}
          for i, url in enumerate(SOURCES):
              try:
                  data = fetch(url)
              except Exception as e:
                  print("ERRORE fonte", url, e)
                  continue
              for _, el in ET.iterparse(io.BytesIO(data)):
                  if el.tag == "channel":
                      cid = el.get("id") or ""
                      c = chans.setdefault(f"{i}:{cid}", {"names": [], "p": []})
                      c["names"] += [d.text for d in el.findall("display-name") if d.text] + [cid]
                      el.clear()
                  elif el.tag == "programme":
                      sid = f"{i}:{el.get('channel')}"
                      st, sp = tstamp(el.get("start", "")), tstamp(el.get("stop", ""))
                      if sid in chans and sp > FROM and st < TO and sp > st:
                          title = (el.findtext("title") or "").strip()[:90]
                          desc = (el.findtext("desc") or "").strip()[:140] if st < DESC_UNTIL else ""
                          if title:
                              chans[sid]["p"].append([st, sp, title, desc])
                      el.clear()

          mapping, out = {}, {}
          for sid, c in chans.items():
              clean = []
              for x in sorted(c["p"]):
                  if not clean or x[0] >= clean[-1][1]:
                      clean.append(x)
              if not clean:
                  continue
              out[sid] = clean[:40]
              for n in c["names"]:
                  k = norm(n)
                  if k and k not in mapping:
                      mapping[k] = sid
          for alias, canon in ALIASES.items():
              if canon in mapping:
                  mapping[alias] = mapping[canon]

          if len(out) < 20:
              print("Troppi pochi canali trovati:", len(out), "- non aggiorno")
              sys.exit(1)
          payload = json.dumps({"v": 1, "gen": NOW, "map": mapping, "ch": out}, ensure_ascii=False, separators=(",", ":")).encode()
          with open("epg.json.gz", "wb") as raw, gzip.GzipFile(fileobj=raw, mode="wb", compresslevel=9, mtime=0) as f:
              f.write(payload)
          print("canali:", len(out), "| nomi:", len(mapping), "| dimensione non compressa:", len(payload), "byte")
          PY
      - name: Pubblica
        run: |
          git config user.name "epg-bot"
          git config user.email "epg-bot@users.noreply.github.com"
          git add epg.json.gz
          git diff --cached --quiet || git commit -m "Aggiorna guida TV"
          git push
